<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Formatação de textos</h1>

    <!-- DEIXAR O TEXTO NEGRITO -->
    <p>Esse é um texto <b>NEGRITO</b></p>

    <!-- DEMARCAR ALGO IMPORTANTE NO TEXTO -->
    <p>Esse é um texto <strong>IMPORTANTE</strong></p>

    <!-- DEIXAR O TEXTO COM ASPECTO ITALICO -->
    <p>Esse é um texto <i>ITALICO</i></p>

    <!-- DEIXAR O TEXTO COM MAS ÊNFASE -->
    <p>Esse é um texto <em>ÊNFASE</em></p>

    <!-- DEIXAR O TEXTO MARCADO -->
    <p>Esse é um texto <mark>MARCADO</mark></p>

    <!-- DEIXAR O TEXTO SUBLINHADO -->
    <p>Esse é um texto <u>SUBLINHADO</u></p>

    <!-- DEIXAR O TEXTO COM ASPECTO APAGADO -->
    <p>Esse é um texto <del>APAGADO</del></p>

    <h1>Diferentes tipos de caracteres</h1>


    <!-- DEIXAR UM NUMERO ELEVADO, PODEMOS USAR O SUP (Supescrito) -->
    <p>Sobrescrito : 10 <sup>2</sup></p>

    <!-- DEIXAR O NUMERO SUBSCRITO -->
    <p>Subscrito: H <sub>2</sub>O</p>
</body>
</html>
