<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos da Tabela</title>
</head>
<body>

    <style>
        table,td,th {
            border: 1px solid gray;
        }
    </style>

    <h1>Produtos</h1>

    <!-- TABELA (CONTEUDO) -->
    <table>
        <!-- CRIAÇAO DA LINHA DA TABELA -->
        <tr>
            <!-- CRIAÇAO DO DADOS DA TABELA USAMOS O TD PARA ISSO -->
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preço</th>
            
        </tr>
        <tr>
            <td>Notebook</td>
            <td>2</td>
            <td>R$ 25,00</td>
        </tr>
        <tr>
            <td>Tablet</td>
            <td>4</td>
            <td>R$ 100,00</td>
        </tr>


        <tr>
            <td rowspan="2">Desconto</td>
            <td colspan="2">Cupom 1 - R$ 20,00</td>
            
        </tr>

        <tr>
            <td colspan="2">Cupom 2 - R$ 20,00</td>
        </tr>
    </table>
    
</body>
</html>
