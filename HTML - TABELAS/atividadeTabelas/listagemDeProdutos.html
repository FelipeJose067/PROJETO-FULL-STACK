<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de produtos</title>

    <style>
        tfoot{
            background-color: gray;
            color: black;
        }
        tbody{
            background-color: aquamarine;
            color: black;
        }
        caption{
            background-color: black;
            color: white;
        }
        thead{
            background-color: darkgoldenrod;
            color: white;
        }
    </style>
</head>
<body>

    <h1>A sua <mark>LOJA</mark> <i>VIRTUAL</i></h1>

    <table border="1">
        <caption>Listagem de Protudos</caption>

        <!-- CABEÇALHO DA NOSSA TABELA -->
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Preço</th>
            </tr>
        </thead>

        <!-- CORPO DA NOSSA TABELA -->
        <tbody>
            <tr>
                <td>Notebook</td>
                <td>1</td>
                <td>R$ - 2000,00</td>
            </tr>

            <tr>
                <td>Tablet</td>
                <td>2</td>
                <td>R$ - 1000,00</td>
            </tr>
        </tbody>

        <!-- RODAPÉ DA NOSSA TABELA -->
        <tfoot>
            <tr>
                <td>Total</td>
                <td colspan="2">R$ 4000,00</td>
            </tr>
        </tfoot>
    </table>
    
</body>
</html>
